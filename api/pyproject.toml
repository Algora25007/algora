[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "algora-api"
version = "0.2.0"
description = "Algora API: auth (email OTP + TOTP), strategies, broker accounts, risk limits, backtests, import"
requires-python = ">=3.12"
dependencies = [
  "algora-engine==0.2.0",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30,<3",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3",
  "email-validator>=2.1",
  "pyjwt>=2.8",
  "pyotp>=2.9",
  "cryptography>=42",
  "python-multipart>=0.0.9",
  "redis>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF"]
ignore = ["S101", "B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"migrations/*" = ["E501"]
