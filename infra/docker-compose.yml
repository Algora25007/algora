# Local development stack: Postgres + TimescaleDB, Redis, and the API.
#   cp infra/.env.example infra/.env   # then fill in the secrets
#   docker compose -f infra/docker-compose.yml up --build
name: algora

services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: algora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      POSTGRES_DB: algora
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algora -d algora"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    env_file: .env
    environment:
      ALGORA_DATABASE_URL: postgresql+psycopg://algora:${POSTGRES_PASSWORD}@db:5432/algora
      ALGORA_REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
